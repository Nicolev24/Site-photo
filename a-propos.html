<h1>À propos · Photographe à Ath</h1>
<h2>Derrière l'objectif</h2>
<p>Je suis Nicolas, photographe indépendant basé à Ath. Mariages, couples, portraits, événements, mais aussi commerces et entreprises : j'aime photographier les gens tels qu'ils sont.</p>
<p>Ce qui me plaît dans ce métier, c'est de capter des moments vrais, sans les mettre en scène, et de voir la réaction de mes clients quand ils découvrent leurs photos.</p>
<img src="images/photographe.jpg" alt="Nicolas Leveugle, photographe à Ath" width="1050" height="1400" loading="lazy" />
<img src="images/mariages/gateau-lumiere.jpg" alt="Les mariés derrière leur pièce montée, dans un faisceau de lumière" width="2134" height="1421" loading="lazy" />
<p>Ma façon de travailler</p>
<h2>Naturel avant tout</h2>
<p>Je vous guide juste assez pour que vous soyez à l'aise, puis je laisse la place aux vrais moments : un regard, un rire, une main qui se serre.</p>
<p>Côté retouche, je reste sobre : une lumière soignée, des couleurs fidèles, et vous, tels que vous êtes.</p>
<p><a href="services.html?pour=particuliers">Voir les formules</a></p>

<p>Pour les commerces</p>
<h2>Des photos qui donnent envie de pousser la porte</h2>
<p>Pour les commerces et les entreprises, je réalise des photos prêtes pour votre fiche Google, vos réseaux et votre site.</p>
<p>Et si vous n'avez pas encore de site, je peux aussi vous créer un site vitrine simple et efficace.</p>
