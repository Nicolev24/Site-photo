<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Page affichée par GitHub Pages pour toute adresse qui n'existe pas.
     Chemins absolus : elle peut s'afficher à n'importe quelle profondeur. -->
<title>Page introuvable | Nicolas Leveugle Photographie</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/icones/favicon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#1c1916" />
<style>
  .page-404 {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px 24px;
  }
  .page-404-grille {
    display: grid;
    grid-template-columns: auto minmax(0, 420px);
    gap: 72px;
    align-items: center;
  }
  .page-404 .polaroid-404 {
    width: min(300px, 78vw);
    margin: 0;
    padding: 16px 16px 0;
    background: #f3efe7;
    color: #2a2622;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
    transform: rotate(-4deg);
  }
  .polaroid-404 img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    height: auto;
    object-fit: cover;
    object-position: 50% 60%;
  }
  .polaroid-404 span {
    display: block;
    padding: 18px 4px 22px;
    font-family: "Caveat", "Segoe Print", cursive;
    font-size: 1.9rem;
    line-height: 1;
  }
  .page-404 h1 {
    margin: 0 0 14px;
    font-size: clamp(2rem, 4vw, 2.8rem);
  }
  .page-404 p {
    color: var(--couleur-texte-attenue);
    line-height: 1.7;
  }
  .page-404-liens {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 26px;
  }
  .page-404-liens .btn {
    margin: 0;
  }
  @media (max-width: 760px) {
    .page-404-grille {
      grid-template-columns: 1fr;
      gap: 40px;
      justify-items: center;
      text-align: center;
    }
    .page-404-liens {
      justify-content: center;
    }
  }
</style>
</head>
<body>
<main class="page-404">
  <div class="page-404-grille">
    <figure class="polaroid-404" aria-hidden="true">
      <img src="/images/tailles/mariages/maries-course-jardin-800.webp" alt="" />
      <span>Elle s'est enfuie…</span>
    </figure>
    <div>
      <span class="eyebrow">Erreur 404</span>
      <h1>Cette page est introuvable</h1>
      <p>L'adresse est peut-être incomplète, ou la page a changé de place. Pas d'inquiétude : tout le reste est toujours là.</p>
      <div class="page-404-liens">
        <a class="btn btn-primary" href="/">Retour à l'accueil</a>
        <a class="btn btn-contour" href="/services.html">Services &amp; tarifs</a>
        <a class="btn btn-contour" href="/contact.html">Me contacter</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
