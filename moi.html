<h1>Qui suis-je · Photographe à Ath</h1>
<h2>Derrière l'objectif</h2>
<p>Je suis Nicolas, photographe indépendant basé à Ath. Mariages, couples, portraits, événements : j'aime photographier les gens tels qu'ils sont.</p>
<p>Ce qui me plaît dans ce métier, c'est de capter des moments vrais, sans les mettre en scène, et de voir la réaction de mes clients quand ils découvrent leurs photos.</p>
<img src="images/nicolas-leveugle-portrait.jpg" alt="Nicolas Leveugle, photographe à Ath" width="1320" height="1650" loading="lazy" />
<p>Ma façon de travailler</p>
<h2>Naturel avant tout</h2>
<p>Je vous guide juste assez pour que vous soyez à l'aise, puis je laisse la place aux vrais moments : un regard, un rire, une main qui se serre.</p>
<p>Côté retouche, je reste sobre : une lumière soignée, des couleurs fidèles, et vous, tels que vous êtes.</p>
<p><a href="travail.html">Voir mon travail</a></p>

<h2>Qui suis-je · Photographe à Ath</h2>
<h2>Derrière l'objectif</h2>
<p>Je suis Nicolas, photographe indépendant basé à Ath. Pour les commerces et les entreprises, je réalise des photos qui montrent votre lieu, votre équipe et votre savoir-faire.</p>
<p>Des photos prêtes pour votre fiche Google, vos réseaux et votre site — et si vous n'avez pas encore de site, je peux aussi vous en créer un.</p>
<img src="images/nicolas-leveugle-portrait.jpg" alt="Nicolas Leveugle, photographe à Ath" width="1320" height="1650" loading="lazy" />
<p>Ma façon de travailler</p>
<h2>Des photos qui vous ressemblent</h2>
<p>Je viens sur place, au moment qui vous arrange, et je m'adapte à votre activité. On prépare ensemble la liste des photos utiles : vitrine, équipe, produits, ambiance.</p>
<p>Le résultat : des photos naturelles, qui donnent envie de pousser la porte.</p>
