  // Maquette : le contenu de ces pages vient de /labo/contenu/ (le site en ligne n'est pas touché).
  (function () {
    var f = window.fetch.bind(window);
    var LABO = { "content/pages/travail.json": 1, "content/pages/moi.json": 1, "content/navigation.json": 1, "content/site.json": 1 };
    window.fetch = function (url, opt) {
      if (typeof url === "string" && LABO[url]) url = "labo/contenu/" + url.split("/").pop();
      return f(url, opt);
    };
  })();
</script>
