<h1>Photographe à Ath · Wallonie &amp; Bruxelles</h1>
<p>Des photos naturelles, qui vous ressemblent.</p>
<p>Mariages, portraits, couples, événements et commerces — un style épuré, chaleureux, sans surenchère de retouche.</p>
<h2><a href="a-propos.html?pour=particuliers">Particuliers : Mariages · portraits</a></h2>
<img src="images/teaser-evenements.jpg" alt="Mariés entourés de leurs témoins" width="1199" height="1800" loading="lazy" />
<h2><a href="a-propos.html?pour=commerces">Commerces : Photos &amp; site vitrine</a></h2>
<img src="images/teaser-entreprises.jpg" alt="Séance chez un barbier" width="1200" height="1800" loading="lazy" />
<blockquote><p>Pas de pose figée : juste vous, et la lumière du moment.</p></blockquote>
<h2>Quelques conseils pour de belles photos</h2>
<h3>Particuliers</h3><ol><li><strong>Choisir la bonne lumière</strong> : La fin d'après-midi offre la lumière la plus douce pour les portraits et les couples. Pour un mariage, pensez-y en construisant le déroulé de la journée.</li><li><strong>Porter ce qui vous ressemble</strong> : Des vêtements dans lesquels vous êtes à l'aise, aux couleurs sobres ou assorties. Évitez les grands logos et les motifs très serrés.</li><li><strong>Oublier l'objectif</strong> : Parlez, riez, bougez : les plus belles photos arrivent quand on ne pose pas.</li></ol>
<h3>Commerces</h3><ol><li><strong>Préparer le lieu</strong> : Comptoir dégagé, lumières allumées, vitrine propre : tout ce qui se voit sera sur les photos.</li><li><strong>Lister les photos utiles</strong> : Vitrine, équipe, produits, ambiance : une courte liste suffit pour partir sur de bonnes bases.</li><li><strong>Choisir un moment calme</strong> : En dehors des heures de pointe, on photographie sans gêner vos clients.</li></ol>
<h2>Envie d'en savoir plus ?</h2>
<p>Découvrez les formules et les tarifs, ou écrivez-moi directement.</p>
<p><a href="services.html">Voir les formules et tarifs</a></p>
