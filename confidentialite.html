<p>Vie privée</p>
<h1>Politique de confidentialité</h1>
<p>Comment vos données personnelles sont traitées lorsque vous utilisez ce site.</p>
<h2>Responsable du traitement</h2>
<p>Nicolas Leveugle, dont les coordonnées figurent dans les mentions légales, est responsable du traitement des données personnelles collectées via ce site.</p>
<h2>Données collectées</h2>
<p>Les seules données personnelles collectées sur ce site sont celles que vous transmettez volontairement via le formulaire de contact : nom, adresse email, type de séance souhaité et message.</p>
<p>Ce site n'utilise aucun cookie, aucun outil d'analyse d'audience ni aucun traceur.</p>
<h2>Finalité du traitement</h2>
<p>Ces données sont utilisées exclusivement pour répondre à votre demande de contact ou de réservation d'une séance photo.</p>
<h2>Base légale</h2>
<p>Le traitement repose sur votre consentement explicite, donné en cochant la case prévue à cet effet avant l'envoi du formulaire, ainsi que, le cas échéant, sur l'exécution de mesures précontractuelles ou contractuelles liées à votre demande.</p>
<h2>Mode de transmission</h2>
<p>Le formulaire de contact ouvre directement votre messagerie habituelle (via un lien « mailto ») : les données que vous saisissez sont envoyées par email, et ne transitent par aucun serveur intermédiaire ni base de données de ce site.</p>
<h2>Durée de conservation</h2>
<p>Les emails reçus sont conservés dans la messagerie de Nicolas Leveugle le temps nécessaire au traitement de votre demande et, le cas échéant, à la relation commerciale qui en découle, puis supprimés ou archivés conformément aux obligations légales applicables.</p>
<h2>Destinataires des données</h2>
<p>Vos données ne sont transmises à aucun tiers. Seul Nicolas Leveugle y a accès, via sa messagerie électronique personnelle.</p>
<h2>Vos droits</h2>
<p>Conformément au Règlement général sur la protection des données (RGPD), vous disposez d'un droit d'accès, de rectification, d'effacement, de limitation du traitement et d'opposition concernant vos données personnelles. Vous pouvez exercer ces droits en écrivant à nicolasleveugle@hotmail.com.</p>
<h2>Réclamation</h2>
<p>Si vous estimez que vos droits ne sont pas respectés, vous pouvez introduire une réclamation auprès de l'Autorité de protection des données (APD) : Rue de la Presse 35, 1000 Bruxelles — www.autoriteprotectiondonnees.be.</p>
</noscript><!-- version-texte:fin --></main>
